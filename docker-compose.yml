#
# docker-compose.yml — Hermes Agent
#
# Cross-platform: works on Docker Desktop (Windows/macOS) and native Linux.
# It publishes explicit ports rather than using `network_mode: host` because
# host networking is unsupported on Docker Desktop; explicit mapping works on
# every platform and keeps the dashboard pinned to host loopback (see SECURITY).
#
# SINGLE-CONTAINER model. The base image (nousresearch/hermes-agent) uses
# s6-overlay supervision: /init is PID 1 and supervises the gateway AND the
# dashboard inside ONE container. Do NOT split them into two services — both
# would mount the same /opt/data volume and collide on the gateway runtime
# lock ("ERROR gateway.run: runtime lock is already held by another instance")
# plus an s6-log lock on /opt/data/logs/gateways/default/lock.
#
# How it runs:
#   - command: ["gateway", "run"] is the legacy single-container invocation the
#     image still supports: container_boot seeds the default gateway state as
#     `running` so s6 supervises it (hermes_cli/container_boot.py).
#   - The dashboard is an s6 service toggled by env (HERMES_DASHBOARD=1), not a
#     second container or command. It binds 0.0.0.0:9119 inside the container;
#     --tui is not involved (the dashboard service never passes it).
#
# Usage:
#   docker compose up -d --build
#
# SECURITY: the dashboard binds 0.0.0.0 INSIDE the container, so its auth gate
# engages (a non-loopback bind REQUIRES an auth provider). config.yaml ships a
# `basic_auth` block that satisfies this — you MUST set HERMES_DASH_PW and
# HERMES_DASH_SECRET in .env or the dashboard refuses to bind. NOTE:
# HERMES_DASHBOARD_INSECURE=1 / --insecure is a NO-OP on current images (the
# June 2026 hardening) — it does NOT disable auth. Reaching a logged-in session
# grants a full agent session (shell + access to the mounted repo), so the
# "127.0.0.1:" prefix on the host port mapping below still matters: it keeps the
# PUBLISHED port off the LAN — keep it. Never change it to "9119:9119" or
# "0.0.0.0:...". For gated OAuth instead of basic_auth, register a provider via
# HERMES_DASHBOARD_OAUTH_CLIENT_ID.
#
services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    # Instance identity. HERMES_PROJECT (set per instance in .env) names the
    # container hermes-<project>, so multiple instances never collide on the
    # global Docker container name. Leave it unset only for a throwaway single
    # instance (falls back to hermes-default).
    container_name: hermes-${HERMES_PROJECT:-default}
    restart: unless-stopped
    # --- Per-instance resource ceilings (fleet DoS containment) ------------------
    # Guards, not tight quotas: sized above a normal browsing agent (chromium + node
    # + python) so one runaway / leaking / fork-bombing instance can't starve hermes1
    # and take down the whole fleet. Override per instance in .env if a workload
    # genuinely needs more. See AGENT-ACCESS-DESIGN.md (layered defense).
    mem_limit: ${HERMES_MEM_LIMIT:-4g}
    cpus: ${HERMES_CPUS:-2}
    pids_limit: ${HERMES_PIDS_LIMIT:-2048}
    ulimits:
      nofile:
        soft: ${HERMES_NOFILE:-8192}
        hard: ${HERMES_NOFILE:-8192}
    # Land interactive shells (docker exec / the chat shell) in /projects.
    working_dir: /projects
    volumes:
      - .hermes:/opt/data
      - ./projects/:/projects
    environment:
      # Remap the in-container hermes user to this UID/GID at boot. On Docker
      # Desktop (Windows/macOS) ownership is handled by the file-sharing layer,
      # so the default is fine. On native Linux (the hermes1 fleet) set these in
      # .env to the instance's DEDICATED host user (hermes-<project>, uid 1000X) so
      # the agent runs isolated from every other instance, and the files it writes
      # to ./projects are owned by that user. See PROVISIONING-HERMES-1.md Step 3.
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # Keep the gateway home (/opt/data) at setgid 2770 so the operator (a member
      # of the instance's group) can reach .hermes without sudo — otherwise the
      # gateway re-chmods it to 0700 on every config load. MUST be forwarded here or
      # the .env value never reaches the gateway. See PROVISIONING-HERMES-1.md Step 5.
      - HERMES_HOME_MODE=${HERMES_HOME_MODE:-2770}
      # Dashboard basic-auth secrets, injected from .env so .hermes/config.yaml
      # stays secret-free and committable (config.yaml references these via
      # ${...}). Values MUST be $-free — compose interpolates $ (use a plaintext
      # password that Hermes hashes in memory, not a scrypt hash).
      - HERMES_DASH_PW=${HERMES_DASH_PW:-}
      - HERMES_DASH_SECRET=${HERMES_DASH_SECRET:-}
      # Provider API key + base URL — supplied from the project-root .env
      # (git-ignored). Copy .env.example to .env and fill it in. Keeps the key
      # out of config.yaml; OPENAI_BASE_URL also pre-fills the setup wizard.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      # Optional: authenticate the `claude` CLI inside the container as your
      # logged-in Claude Pro/Max account. Generate with `claude setup-token`.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Dashboard: runs as a supervised s6 service inside this same container.
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      # NO-OP on current images (June 2026 hardening): auth is enforced by the
      # config.yaml basic_auth block regardless of this flag. Kept only for
      # older-image compatibility; it does NOT disable the auth gate.
      - HERMES_DASHBOARD_INSECURE=1
      # Make the agent create new project files in /projects (the bind mount
      # above), not the data home /opt/data. TERMINAL_CWD is where the agent's
      # shell/file tools run (the gateway bridges it from terminal.cwd);
      # HERMES_CWD is the TUI/chat's project dir. Hermes prints a benign
      # startup warning suggesting terminal.cwd in config.yaml — ignore it, or
      # set `terminal: { cwd: /projects }` in .hermes/config.yaml to silence it.
      - TERMINAL_CWD=/projects
      - HERMES_CWD=/projects
    ports:
      # Host-side dashboard port comes from HERMES_PORT (.env); keep the
      # container side 9119. Give each instance a distinct HERMES_PORT.
      - "127.0.0.1:${HERMES_PORT:-9119}:9119"
    extra_hosts:
      # cloud1's LAN IP. llm.stormes.net resolves to cloud1's PUBLIC IP, which
      # the shared firewall won't hairpin back from inside the LAN — so pin the
      # name to the LAN IP here (SNI stays llm.stormes.net, so the Let's Encrypt
      # cert still matches). Without this the agent logs in but every chat times
      # out. Containers don't inherit the hermes1 host's /etc/hosts, hence this.
      - "llm.stormes.net:192.168.9.223"
    command: ["gateway", "run"]
